<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sustantix Enterprise Grid</title>
<style>
  :root{color-scheme:light dark}
  html,body{margin:0;height:100%;background:#f8fafc;color:#1e293b;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme:dark){html,body{background:#020617;color:#e2e8f0}}
  .sxg-ws{display:grid;grid-template-columns:240px 1fr;height:100vh}
  .sxg-ws-nav{overflow:auto;padding:12px;border-right:1px solid rgba(100,116,139,.25)}
  .sxg-ws-nav h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#64748b;margin:14px 0 4px}
  .sxg-ws-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:6px;cursor:pointer;font:inherit;color:inherit}
  .sxg-ws-nav button:hover{background:rgba(20,83,45,.08)}
  .sxg-ws-nav button[aria-current=true]{background:#14532d;color:#fff}
  .sxg-ws-main{display:flex;flex-direction:column;min-width:0;padding:12px 16px;overflow:hidden}
  .sxg-ws-title{font-size:18px;margin:0}
  .sxg-ws-sub{margin:2px 0 10px;color:#64748b}
  .sxg-ws-grid{flex:1;min-height:0}
  .sxg-brand{font-weight:700;letter-spacing:.04em;color:#14532d}
  @media (prefers-color-scheme:dark){.sxg-brand{color:#4ade80}}
  @media (max-width:760px){.sxg-ws{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sxg-ws-nav{max-height:30vh;border-right:0;border-bottom:1px solid rgba(100,116,139,.25)}.sxg-ws-main{padding:8px}}
</style>
</head>
<body>
<div id="sxg-workspace" data-api="/api/aip"></div>
<script src="../vendor/xlsx.full.min.js"></script>
<script src="aip-grid.js"></script>
</body>
</html>
