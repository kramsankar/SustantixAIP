name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sustantix/license build
      - name: Typecheck
        run: |
          pnpm --filter @sustantix/license typecheck
          pnpm --filter @sustantix/host-bridge typecheck
          pnpm --filter @sustantix/schema typecheck
          pnpm --filter @sustantix/analytics typecheck
          pnpm --filter @sustantix/agents typecheck
          pnpm --filter @sustantix/grid typecheck
          pnpm --filter @sustantix/bundle typecheck
          pnpm --filter @sustantix/pp-provision typecheck
          pnpm --filter @sustantix/license-cli typecheck
          pnpm --filter @sustantix/aip-web typecheck
      - name: Unit tests
        run: |
          pnpm --filter @sustantix/license test
          pnpm --filter @sustantix/host-bridge test
          pnpm --filter @sustantix/schema test
          pnpm --filter @sustantix/analytics test
          pnpm --filter @sustantix/agents test
          pnpm --filter @sustantix/grid test
          pnpm --filter @sustantix/bundle test
          pnpm --filter @sustantix/pp-provision test
          pnpm --filter @sustantix/aip-powerapp test
          pnpm --filter @sustantix/aip-web test
      - name: Generated schema is current
        run: |
          pnpm --filter @sustantix/schema generate
          git diff --exit-code -- schema supabase/migrations powerplatform/schema
      - name: Data-quality gate (vocabulary, integrity, masters, transactions round trip)
        run: |
          pnpm --filter @sustantix/schema check:data
          git diff --exit-code -- docs/data
      - name: Analytics back-test (quality gates on every engine)
        run: |
          pnpm --filter @sustantix/analytics backtest
          git diff --exit-code -- docs/analytics

  plugin:
    name: Dataverse license plug-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Conformance tests (shared fixtures with the TypeScript verifier)
        run: dotnet test powerplatform/plugins/Sustantix.Aip.Licensing.Tests
      - name: Build signed assembly
        env:
          SX_PLUGIN_SNK_B64: ${{ secrets.SX_PLUGIN_SNK_B64 }}
        run: |
          if [ -n "$SX_PLUGIN_SNK_B64" ]; then
            echo "$SX_PLUGIN_SNK_B64" | base64 -d > "$RUNNER_TEMP/aip-plugin.snk"
            dotnet build powerplatform/plugins/Sustantix.Aip.Licensing -c Release -p:SxSnkPath="$RUNNER_TEMP/aip-plugin.snk"
            rm -f "$RUNNER_TEMP/aip-plugin.snk"
          else
            echo "::warning::SX_PLUGIN_SNK_B64 not configured — building unsigned (not deployable to Dataverse)"
            dotnet build powerplatform/plugins/Sustantix.Aip.Licensing -c Release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: license-plugin
          path: powerplatform/plugins/Sustantix.Aip.Licensing/bin/Release/net462/Sustantix.Aip.Licensing.dll
          retention-days: 14

  database:
    name: Supabase migrations + RLS isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aip_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: aip_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations and prove tenant isolation
        run: |
          for f in supabase/tests/00_supabase_stub.sql supabase/migrations/*.sql supabase/tests/90_rls_isolation.sql supabase/tests/91_reference_rls.sql supabase/tests/92_masters_rls.sql supabase/tests/93_analytics_rls.sql supabase/tests/94_agents_rls.sql supabase/tests/96_transactions_rls.sql supabase/tests/97_changes.sql supabase/tests/98_integration.sql supabase/tests/99_outbox.sql supabase/tests/100_feed.sql supabase/tests/101_schedules.sql supabase/tests/102_datasets.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Seed loads idempotently
        run: |
          pnpm --silent --filter @sustantix/schema seed:sql --tenant 00000000-0000-0000-0000-0000000000c1 --name "CI seed" > "$RUNNER_TEMP/seed.sql"
          psql -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/seed.sql"
          psql -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/seed.sql"
          # 383 workbook work orders + 46 planned (C3) + 24 HSE-cited (C4)
          test "$(psql -At -c "select count(*) from aip.work_orders where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "453"
          test "$(psql -At -c "select count(*) from aip.asset_master where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "1205"
          test "$(psql -At -c "select count(*) from aip.data_correction where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "515"
          test "$(psql -At -c "select count(*) from aip.ref_emission_factor where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "4"
          # Phase 2 masters: 1,205 assets (260 with a parent), 44 parts (2 masters + C12), 335 interventions (2 registers)
          test "$(psql -At -c "select count(*) || '/' || count(parent_id) from aip.asset where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "1205/260"
          test "$(psql -At -c "select count(*) from aip.part where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "44"
          test "$(psql -At -c "select count(*) from aip.intervention where tenant_id='00000000-0000-0000-0000-0000000000c1' and site_id is not null")" = "335"
          test "$(psql -At -c "select count(*) from aip.pv_module where tenant_id='00000000-0000-0000-0000-0000000000c1' and segment_id is not null")" = "6000"
          test "$(psql -At -c "select count(*) from aip.master_lineage where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "11916"
          # Phase 3: transactions and time series, the link ledger, and every compatibility view rebuilding its sheet
          test "$(psql -At -c "select count(*) from aip.plant_telemetry where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "19944"
          test "$(psql -At -c "select count(*) from aip.record_link where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "350"
          # Database-only data: the runtime's 36 tenant datasets (764 tables, 170,440 records), held as compressed blocks
          test "$(psql -At -c "select count(distinct dataset) || '/' || count(*) filter (where part <> '\$frame') || '/' || sum(row_count) from aip.dataset_part where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "36/764/170440"
          test "$(psql -At -c "select sum(row_count) from aip.dataset_block where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "170440"
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/95_compat_equivalence.sql
          # 4 workbook forecasting models + the 10 AIP engines (schema/analytics/models.json)
          test "$(psql -At -c "select count(*) || '/' || count(engine) from aip.ml_model where tenant_id='00000000-0000-0000-0000-0000000000c1'")" = "14/10"
      - name: Governed-model migrations are idempotent
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001000100_aip_reference.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261005000100_aip_masters.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261005000200_aip_analytics.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261005000300_aip_agents.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261006000100_aip_transactions.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261006000200_aip_compat.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261007000100_aip_changes.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261008000100_aip_integration.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261008000200_aip_outbox.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261008000300_aip_feed.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261008000400_aip_schedules.sql
          # Change sets, saved views, staged rows, outbound events and their audit trail survive a re-apply.
          test "$(psql -At -c "select count(*) from aip.change_set")" = "11"
          test "$(psql -At -c "select count(*) || '/' || count(*) filter (where status = 'delivered') from aip.outbox")" = "4/1"
          test "$(psql -At -c "select count(*) || '/' || last_status from aip.agent_schedule group by last_status")" = "1/completed"
          test "$(psql -At -c "select count(*) from aip.staging_row")" = "1"
          test "$(psql -At -c "select count(*) from aip.grid_view")" = "2"

  # The parity crawls (bundled and governed data, screen grids) take most of a CI run. They guard the runtime and what
  # ships with it (including the schema tools and schema/ inputs the governed workbook and the grid catalogue are built
  # from), so they run on main always and elsewhere only when one of those changed.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.diff.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/runtime/|tools/(extract-reference|schema)/|schema/|packages/(host-bridge|grid|license)/|reference/|\.github/workflows/ci\.yml$|pnpm-lock\.yaml$)'; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

  parity:
    name: reference screen parity + license gate
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sustantix/license build
      - run: pnpm --filter @sustantix/aip-runtime exec playwright install --with-deps chromium
      - run: pnpm --filter @sustantix/aip-runtime test
        env:
          AIP_PARITY_OUT: ${{ runner.temp }}/parity
      - name: Governed-mode parity (runtime booted on the governed workbook, against its reviewed baseline)
        run: pnpm --filter @sustantix/aip-runtime test:governed
        env:
          AIP_PARITY_OUT: ${{ runner.temp }}/governed
      - name: Enterprise Grid in a real browser (workspace bundle against a mocked grid API)
        run: pnpm --filter @sustantix/grid test:browser
      - name: Screen grids (every screen switched on, against its reviewed baseline)
        run: pnpm --filter @sustantix/aip-runtime test:grids
        env:
          AIP_PARITY_OUT: ${{ runner.temp }}/grids
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-crawl
          path: |
            ${{ runner.temp }}/parity/crawl.json
            ${{ runner.temp }}/governed/governed-crawl.json
            ${{ runner.temp }}/grids/grid-crawl.json
          retention-days: 14

  database-only:
    name: database-only parity (no tenant data in the build)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sustantix/license build
      - run: pnpm --filter @sustantix/aip-runtime exec playwright install --with-deps chromium
      - name: Vercel build loads every tenant dataset from the host after sign-in, every screen as in the reference
        run: pnpm --filter @sustantix/aip-runtime test:database-only
        env:
          AIP_PARITY_OUT: ${{ runner.temp }}/database-only
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-only-crawl
          path: ${{ runner.temp }}/database-only/crawl.json
          retention-days: 14
